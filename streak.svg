<svg xmlns="http://www.w3.org/2000/svg" width="620" height="100" viewBox="0 0 620 100" role="img"><title>Current and longest streak</title><style>
:root{--fg:#1f2328;--dim:#656d76;--faint:#d0d7de;--accent:#0969da}
@media (prefers-color-scheme: dark){
  :root{--fg:#e6edf3;--dim:#8b949e;--faint:#30363d;--accent:#58a6ff}
}
text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--fg)}
.dim{fill:var(--dim)}
.accent{fill:var(--accent)}
.faint{fill:var(--faint)}
</style><text x="0" y="46" font-size="44" font-weight="700" text-anchor="start" opacity="0">1<animate attributeName="opacity" from="0" to="1" begin="0.10s" dur="0.6s" fill="freeze"/></text><text x="39" y="46" font-size="14" font-weight="400" text-anchor="start" class="dim" >days</text><text x="0" y="70" font-size="13" font-weight="400" text-anchor="start" >current streak</text><text x="0" y="88" font-size="11" font-weight="400" text-anchor="start" class="dim" >Oct 27</text><text x="310" y="46" font-size="44" font-weight="700" text-anchor="start" opacity="0">5<animate attributeName="opacity" from="0" to="1" begin="0.25s" dur="0.6s" fill="freeze"/></text><text x="349" y="46" font-size="14" font-weight="400" text-anchor="start" class="dim" >days</text><text x="310" y="70" font-size="13" font-weight="400" text-anchor="start" >longest streak</text><text x="310" y="88" font-size="11" font-weight="400" text-anchor="start" class="dim" >Oct 7 - Oct 11</text></svg>
