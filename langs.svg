.accent{fill:var(--accent)}
.faint{fill:var(--faint)}
</style><text x="0" y="14" font-size="12" font-weight="400" text-anchor="start" class="dim" >by bytes</text><text x="0" y="44" font-size="12" font-weight="400" text-anchor="start" class="dim" >nothing yet</text><text x="310" y="14" font-size="12" font-weight="400" text-anchor="start" class="dim" >by repo</text><text x="310" y="44" font-size="12" font-weight="400" text-anchor="start" class="dim" >nothing yet</text></svg>
