<svg xmlns="http://www.w3.org/2000/svg" width="620" height="139" viewBox="0 0 620 139" role="img"><title>The last year, one character per day</title><style>
:root{--fg:#1f2328;--dim:#656d76;--faint:#d0d7de;--accent:#0969da}
@media (prefers-color-scheme: dark){
  :root{--fg:#e6edf3;--dim:#8b949e;--faint:#30363d;--accent:#58a6ff}
}
text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--fg)}
.dim{fill:var(--dim)}
.accent{fill:var(--accent)}
.faint{fill:var(--faint)}
</style><text x="0" y="50" font-size="12" font-weight="400" text-anchor="start" class="dim" >nothing to draw yet - the daily action fills this in</text><text x="0" y="127" font-size="11" font-weight="400" text-anchor="start" class="dim" >. none    : a little    + some    # lots    @ peak</text></svg>
